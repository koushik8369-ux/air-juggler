<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Juggler | Gesture Controlled Game</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
</head>

<body>

    <div class="game-container">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">✋</span>
                <h1>AIR JUGGLER</h1>
            </div>
            <p>Gesture Controlled Game</p>
        </header>

        <div class="score-board">
            <div class="score-card">
                <span>SCORE</span>
                <h2 id="score">0</h2>
            </div>

            <div class="score-card">
                <span>BEST</span>
                <h2 id="high-score">0</h2>
            </div>
        </div>

        <main class="game-area">

            <video id="webcam" autoplay playsinline></video>

            <canvas id="output-canvas"></canvas>

            <!-- Hand Controlled Paddle -->
            <div id="paddle"></div>

            <div class="start-screen" id="start-screen">
                <div class="ball-icon">🏀</div>
                <h2>READY TO PLAY?</h2>

                <p>
                    Move your hand to control the paddle.<br>
                    Keep the ball in the air!
                </p>

                <button id="start-btn">START GAME</button>
            </div>

        </main>

        <div class="instructions">
            <div>✋ <span>Move your hand</span></div>
            <div>🏀 <span>Juggle the ball</span></div>
            <div>🔥 <span>Beat your score</span></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
